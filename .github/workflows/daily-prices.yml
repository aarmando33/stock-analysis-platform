name: Daily stock prices

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: read

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy yfinance requests
      - name: Download and validate prices
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python price_feed.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock-price-feed
          path: outputs/
          retention-days: 30
          if-no-files-found: error
