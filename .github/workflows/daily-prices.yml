name: Daily stock prices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "price_feed.py"
      - "tickers.csv"
      - "buy_sell_monitor.py"
      - "export_monitor.py"
      - "compact_monitor.py"
      - "historical_zones.py"
      - "zone_monitor.py"
      - "ticker_dashboard.py"
      - "profile_feed.py"
      - "profile_enrichment.py"
      - "production_integrity.py"
      - "requirements-feed.txt"
      - "requirements-monitor.txt"
      - "symbol_aliases.csv"
      - ".github/workflows/daily-prices.yml"
  schedule:
    # Wake every 20 minutes from 11:17 AM through 5:57 PM Chicago.
    # Fast early runs exit before provider work. Delayed wake-ups can refresh
    # only after 3:05 PM. The nine post-close slots reuse verified output.
    - cron: "17,37,57 16-22 * * 1-5"
    - cron: "17,37,57 17-23 * * 1-5"

permissions:
  contents: read
  actions: read

concurrency:
  group: stock-monitor-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Select scheduled local time
        id: schedule
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python production_integrity.py window
      - run: pip install -r requirements-feed.txt
        if: steps.schedule.outputs.run == 'true'
      - name: Check for a verified current-session report
        id: readiness
        if: steps.schedule.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python production_integrity.py probe
      - name: Download and validate prices
        if: steps.readiness.outputs.refresh == 'true'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: |
          mkdir -p outputs
          set -o pipefail
          python price_feed.py 2>&1 | tee outputs/run.log
      - name: Calculate and export validated monitor
        if: steps.readiness.outputs.refresh == 'true'
        run: |
          python buy_sell_monitor.py --feed outputs --universe tickers.csv --output outputs/monitor_results.json
          python profile_feed.py --input outputs/monitor_results.json --output outputs/monitor_results.json --profiles outputs/profiles.json
          python export_monitor.py outputs/monitor_results.json outputs/Stock_Buy_Sell_Monitor.xlsx
          python ticker_dashboard.py outputs/monitor_results.json outputs/Stock_Buy_Sell_Ticker_Dashboard.html
          python -c "import json,pathlib; r=json.load(open('outputs/monitor_results.json')); s=r['session']; p=pathlib.Path('outputs'); (p/f'Stock_Buy_Sell_Monitor_{s}.xlsx').write_bytes((p/'Stock_Buy_Sell_Monitor.xlsx').read_bytes()); (p/f'Stock_Buy_Sell_Ticker_Dashboard_{s}.html').write_bytes((p/'Stock_Buy_Sell_Ticker_Dashboard.html').read_bytes())"
          python production_integrity.py mark
      - name: Report links and coverage
        if: success() && steps.readiness.outputs.refresh == 'true'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open('outputs/monitor_results.json'))
          print(f"## Stock Buy/Sell Monitor — {r['session']}")
          print(f"Price coverage: {r['counts']['Usable']}/{r['counts']['Expected']}. Download the stock-price-feed artifact below for the Excel monitor and interactive ticker dashboard.")
          print("Freshness, universe, input/code hashes and both deliverables were verified before ready.json was created. Download the report artifact; the small stock-monitor-ready artifact identifies the completed generation run. Retry no-op runs have no report artifact.")
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.readiness.outputs.refresh == 'true'
        with:
          name: stock-price-feed
          path: outputs/
          retention-days: 30
          if-no-files-found: error
      - name: Publish verified readiness record
        uses: actions/upload-artifact@v4
        if: success() && steps.readiness.outputs.refresh == 'true'
        with:
          name: stock-monitor-ready
          path: outputs/ready.json
          retention-days: 30
          if-no-files-found: error
