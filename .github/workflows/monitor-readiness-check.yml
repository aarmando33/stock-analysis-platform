name: Verify published stock monitor

on:
  workflow_run:
    workflows: [Daily stock prices]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-monitor.txt
      - name: Verify published artifact and retry reuse
        env:
          GH_TOKEN: ${{ github.token }}
          MONITOR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MONITOR_RUN_ID: ${{ github.event.workflow_run.id }}
          MONITOR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          python - <<'PY'
          import os,time
          from pathlib import Path
          from buy_sell_monitor import latest_session
          from production_integrity import GitHub,expected_symbols,verify_generation,window_plan
          api=GitHub(os.environ['GITHUB_REPOSITORY'],os.environ['GH_TOKEN'])
          run_id=os.environ['MONITOR_RUN_ID']
          if os.environ['MONITOR_CONCLUSION']!='success':
              raise RuntimeError('Production workflow failed or was cancelled; inspect its diagnostics.')
          result=None
          for attempt in range(3):
              try:
                  result=verify_generation(api,run_id,os.environ['MONITOR_HEAD_SHA'],latest_session(),expected_symbols(Path('.')),window_plan('schedule'))
                  break
              except ValueError:
                  if attempt==2:raise
                  time.sleep(10)
          print(result)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Production readiness: '+str(result)+'\n')
          PY

